{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">
    <div class="card shadow-sm ticket-card">

        <div class="ticket-accent-bar"></div>


        <div class="card-header">
            <h1 class="ticket-header" >Editar Chamado #{{ chamado.id }}</h1>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Solicitante</label>
                    <input
                        type="text"
                        name="solicitante"
                        class="form-control"
                        value="{{ chamado.solicitante }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Setor</label>
                    <input
                        type="text"
                        name="setor"
                        class="form-control"
                        value="{{ chamado.setor }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input
                        type="text"
                        name="titulo"
                        class="form-control"
                        value="{{ chamado.titulo }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descrição</label>
                    <textarea
                        name="descricao"
                        class="form-control"
                        rows="4"
                        required>{{ chamado.descricao }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Categoria</label>
                    <select name="categoria" class="form-select">
                        <option value="Hardware"
                            {% if chamado.categoria == 'Hardware' %}selected{% endif %}>
                            Hardware
                        </option>

                        <option value="Software"
                            {% if chamado.categoria == 'Software' %}selected{% endif %}>
                            Software
                        </option>

                        <option value="Rede"
                            {% if chamado.categoria == 'Rede' %}selected{% endif %}>
                            Rede
                        </option>

                        <option value="Sistema"
                            {% if chamado.categoria == 'Sistema' %}selected{% endif %}>
                            Sistema
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Prioridade</label>
                    <select name="prioridade" class="form-select">
                        <option value="Baixa"
                            {% if chamado.prioridade == 'Baixa' %}selected{% endif %}>
                            Baixa
                        </option>

                        <option value="Média"
                            {% if chamado.prioridade == 'Média' %}selected{% endif %}>
                            Média
                        </option>

                        <option value="Alta"
                            {% if chamado.prioridade == 'Alta' %}selected{% endif %}>
                            Alta
                        </option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">

                        <option value="Aberto"
                            {% if chamado.status == 'Aberto' %}selected{% endif %}>
                            Aberto
                        </option>

                        <option value="Em Atendimento"
                            {% if chamado.status == 'Em Atendimento' %}selected{% endif %}>
                            Em Atendimento
                        </option>

                        <option value="Resolvido"
                            {% if chamado.status == 'Resolvido' %}selected{% endif %}>
                            Resolvido
                        </option>

                        <option value="Fechado"
                            {% if chamado.status == 'Fechado' %}selected{% endif %}>
                            Fechado
                        </option>

                    </select>
                </div>

                <div class="d-flex gap-2">

                    <button type="submit" class="btn btn-primary">
                        Salvar Alterações
                    </button>

                   <a href=" /chamados" class="btn btn-dark">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>
    </div>
</div>

<style>
    /* ===== Container do Form ===== */
    .ticket-card {
        position: relative;
        background: linear-gradient(135deg, #1e3a5f 0%, #2b5ea7 100%);
        border-radius: 20px;
        overflow: hidden;
        border: none;
    }

    .ticket-accent-bar {
        height: 5px;
        background: linear-gradient(90deg, #92EEFF, #D8FFC5, #C4F7CA);
    }

    /* ===== Header ===== */
    .ticket-header {
        padding: 10px;
        text-align: center;
        color: white;
    }

    .ticket-header h1 {
        margin: 0;
        font-size: 1.8rem;
        font-weight: 700;
    }


    /* ===== Form ===== */
    .ticket-card .form-label {
        color: white;
        font-weight: 600;
    }

    .ticket-card .form-control,
    .ticket-card .form-select {
        background: rgba(255, 255, 255, .08);
        border: 1px solid rgba(255, 255, 255, .15);
        color: white;
    }

    .ticket-card .form-control::placeholder {
        color: rgba(255, 255, 255, .55);
    }

    .ticket-card .form-control:focus,
    .ticket-card .form-select:focus {
        background: rgba(255, 255, 255, .12);
        color: white;
        border-color: #92EEFF;
        box-shadow: 0 0 0 .2rem rgba(146, 238, 255, .25);
    }

    /* Select options */
    .ticket-card select option {
        color: #000;
    }

    /* ===== Botões ===== */
    .btn-save-ticket {
        background: linear-gradient(90deg,
                #92EEFF,
                #D8FFC5,
                #C4F7CA);
        color: #1e3a5f;
        border: none;
        font-weight: 700;
        transition: .3s;
    }

    .btn-save-ticket:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(146, 238, 255, .25);
        color: #1e3a5f;
        
    }

    .btn-cancel-ticket {
        border: 1px solid rgba(255, 255, 255, .25);
        color: white;
        background: transparent;
    }

    .btn-cancel-ticket:hover {
        background: rgba(255, 255, 255, .08);
        color: white;
    }
</style>

{% endblock %}
