{% extends 'base.html' %}

{% block content %}

<div class="containerFormulario my-5">

    <div class="card cardPadrao">

        <div class="barraDestaque"></div>

        <div class="cabecalhoCard text-center">
            <h1 class="h4 mb-0 fw-bold text-tema">
                Editar Chamado #{{ chamado.id }}
            </h1>
            <p class="subtituloCard mt-2 mb-0">
                Atualize as informações do chamado
            </p>
        </div>

        <div class="card-body p-4">

            <form method="POST">

                <div class="mb-3">
                    <label for="solicitante" class="form-label labelCampo">Solicitante</label>
                    <input
                        type="text"
                        name="solicitante"
                        id="solicitante"
                        class="form-control inputPadrao"
                        value="{{ chamado.solicitante }}"
                        required>
                </div>

                <div class="mb-3">
                    <label for="setor" class="form-label labelCampo">Setor</label>
                    <input
                        type="text"
                        name="setor"
                        id="setor"
                        class="form-control inputPadrao"
                        value="{{ chamado.setor }}"
                        required>
                </div>

                <div class="mb-3">
                    <label for="titulo" class="form-label labelCampo">Título</label>
                    <input
                        type="text"
                        name="titulo"
                        id="titulo"
                        class="form-control inputPadrao"
                        value="{{ chamado.titulo }}"
                        required>
                </div>

                <div class="mb-3">
                    <label for="descricao" class="form-label labelCampo">Descrição</label>
                    <textarea
                        name="descricao"
                        id="descricao"
                        class="form-control textareaPadrao"
                        rows="4"
                        required>{{ chamado.descricao }}</textarea>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <label for="categoria" class="form-label labelCampo">Categoria</label>
                        <select name="categoria" id="categoria" class="form-select selectPadrao">
                            <option value="Hardware" {% if chamado.categoria == 'Hardware' %}selected{% endif %}>Hardware</option>
                            <option value="Software" {% if chamado.categoria == 'Software' %}selected{% endif %}>Software</option>
                            <option value="Rede" {% if chamado.categoria == 'Rede' %}selected{% endif %}>Rede</option>
                            <option value="Sistema" {% if chamado.categoria == 'Sistema' %}selected{% endif %}>Sistema</option>
                            <option value="E-mail" {% if chamado.categoria == 'E-mail' %}selected{% endif %}>E-mail</option>
                        </select>
                    </div>

                    {% if current_user.is_admin or current_user.is_operador %}
                    <div class="col-sm-6">
                        <label for="prioridade" class="form-label labelCampo">Prioridade</label>
                        <select name="prioridade" id="prioridade" class="form-select selectPadrao">
                            <option value="Baixa" {% if chamado.prioridade == 'Baixa' %}selected{% endif %}>Baixa</option>
                            <option value="Média" {% if chamado.prioridade == 'Média' %}selected{% endif %}>Média</option>
                            <option value="Alta" {% if chamado.prioridade == 'Alta' %}selected{% endif %}>Alta</option>
                            <option value="Crítica" {% if chamado.prioridade == 'Crítica' %}selected{% endif %}>Crítica</option>
                        </select>
                    </div>
                    {% endif %}
                </div>

                {% if current_user.is_admin or current_user.is_operador %}
                <div class="mb-4">
                    <label for="status" class="form-label labelCampo">Status</label>
                    <select name="status" id="status" class="form-select selectPadrao">
                        <option value="Aberto" {% if chamado.status == 'Aberto' %}selected{% endif %}>Aberto</option>
                        <option value="Em Atendimento" {% if chamado.status == 'Em Atendimento' %}selected{% endif %}>Em Atendimento</option>
                        <option value="Resolvido" {% if chamado.status == 'Resolvido' %}selected{% endif %}>Resolvido</option>
                        <option value="Fechado" {% if chamado.status == 'Fechado' %}selected{% endif %}>Fechado</option>
                    </select>
                </div>
                {% endif %}

                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                    <a href="{{ url_for('chamados.detalhes_chamado', id=chamado.id) }}" class="btn botaoSecundario px-4 me-md-2">
                        Cancelar
                    </a>
                    <button type="submit" class="btn botaoPrimario px-5">
                        Salvar Alterações
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

{% endblock %}
