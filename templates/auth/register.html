{% extends 'base.html' %}

{% block content %}

<div class="containerAutenticacao d-flex justify-content-center align-items-center py-4">

    <div class="cardAutenticacao">

        <div class="text-center mb-4">
            <div class="iconeUsuario mb-3">
                <i class="bi bi-person-plus-fill"></i>
            </div>

            <h2 class="fw-bold mb-1 text-tema">
                Criar Conta
            </h2>

            <p class="text-tema-secundario mb-0">
                Cadastre-se para acessar a Central de Chamados
            </p>
        </div>

        {% if error %}
        <div class="alert alert-danger mb-4 py-2 text-center" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="mb-3">
                <label class="form-label labelCampo">
                    Nome Completo
                </label>
                <input
                    type="text"
                    name="nome"
                    class="form-control inputPadrao"
                    placeholder="Digite seu nome completo"
                    required
                    autofocus>
            </div>

            <div class="mb-3">
                <label class="form-label labelCampo">
                    E-mail
                </label>
                <input
                    type="email"
                    name="email"
                    class="form-control inputPadrao"
                    placeholder="seu.email@empresa.com"
                    required>
            </div>

            <div class="mb-4">
                <label class="form-label labelCampo">
                    Senha
                </label>
                <input
                    type="password"
                    name="senha"
                    class="form-control inputPadrao"
                    placeholder="Crie uma senha segura"
                    required>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn botaoPrimario py-2 rounded-3">
                    Cadastrar
                </button>
            </div>

            <div class="text-center mt-3">
                <span class="text-tema-secundario small">Já possui uma conta?</span>
                <div class="mt-2">
                    <a href="{{ url_for('auth.login') }}" class="btn btn-sm botaoSecundario px-3">
                        Fazer Login
                    </a>
                </div>
            </div>

        </form>

    </div>

</div>

{% endblock %}
