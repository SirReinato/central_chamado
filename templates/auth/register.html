{% extends 'base.html' %}

{% block content %}

<div class="login-wrapper d-flex justify-content-center align-items-center">

    <div class="login-card">

        <div class="text-center mb-4">

            <div class="user-icon">
                ✨
            </div>

            <h2 class="fw-bold mt-3">
                Criar Conta
            </h2>

            <p class="text-secondary mb-2">
                Crie sua conta para acessar a Central de Chamados
            </p>

        </div>

        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="mb-4">
                <label class="form-label">
                    Nome Completo
                </label>

                <input
                    type="text"
                    name="nome"
                    class="form-control custom-input"
                    placeholder="Digite seu nome"
                    required>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control custom-input"
                    placeholder="Digite seu email"
                    required>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    Senha
                </label>

                <input
                    type="password"
                    name="senha"
                    class="form-control custom-input"
                    placeholder="Crie uma senha"
                    required>
            </div>

            <div class="d-grid mb-3">

                <button
                    type="submit"
                    class="btn btn-success btn-lg rounded-pill"
                    href="{{ url_for('auth.aguardando_aprovacao') }}">
                    Criar Conta

                </button>

            </div>

            <div class="text-center">

                <span class="text-secondary">
                    Já possui cadastro?
                </span>

                <br>

                <a href="{{ url_for('auth.login') }}" class="btn btn-outline-success btn-lg rounded-pill">

                    Fazer Login

                </a>

            </div>

        </form>

    </div>

</div>

<style>

.login-wrapper{
    min-height: 75vh;
}

.login-card{

    width: 100%;
    max-width: 520px;

    padding: 40px;

    background: #1f2937;

    border-radius: 30px;

    border: 2px solid rgba(25,135,84,.5);

    box-shadow:
        0 0 15px rgba(25,135,84,.35),
        0 0 30px rgba(25,135,84,.15);

}

.user-icon{

    width: 90px;
    height: 90px;

    margin: auto;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 36px;

    border-radius: 50%;

    border: 2px solid #198754;

    box-shadow:
        0 0 10px rgba(25,135,84,.6);

}

.custom-input{

    background: transparent;

    border: none;
    border-bottom: 2px solid #6c757d;

    border-radius: 0;

    color: white;

}

.custom-input::placeholder{
    color: #8f9ba8;
}

.custom-input:focus{

    background: transparent;

    color: white;

    border-bottom: 2px solid #198754;

    box-shadow: none;

}

.form-label{
    color: #d1d5db;
    font-weight: 500;
}

</style>

{% endblock %}
