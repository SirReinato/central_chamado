{% extends 'base.html' %}

{% block content %}

<div class="containerAutenticacao d-flex justify-content-center align-items-center py-4">

    <div class="cardAutenticacao">

        <div class="text-center mb-4">
            <div class="iconeUsuario mb-3">
                <i class="bi bi-person-fill"></i>
            </div>

            <h2 class="fw-bold mb-1 text-tema">
                Entrar
            </h2>

            <p class="text-tema-secundario mb-0">
                Central de Chamados
            </p>
        </div>

        {% if error %}
        <div class="alert alert-danger mb-4 py-2 text-center" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label class="form-label labelCampo">
                    E-mail Institucional
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-tema-secundario" style="border-color: var(--cor-borda);">
                        <i class="bi bi-envelope-at"></i>
                    </span>
                    <input type="text" name="email" class="form-control inputPadrao border-start-0 ps-0" placeholder="nome.sobrenome@king.com" value="{{ request.form.get('email', '') }}" required autofocus autocomplete="username">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label labelCampo">
                    Senha
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-tema-secundario" style="border-color: var(--cor-borda);">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" name="senha" id="loginSenha" class="form-control inputPadrao border-start-0 ps-0" placeholder="Digite sua senha" required autocomplete="current-password">
                    <button class="btn btn-outline-secondary border-start-0" type="button" id="btnToggleLoginSenha" style="border-color: var(--cor-borda); color: var(--cor-texto-secundario);" title="Mostrar/ocultar senha">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn botaoPrimario py-2 rounded-3">
                    Entrar no Sistema
                </button>
            </div>

            <div class="text-center mt-3">
                <span class="text-tema-secundario small">Ainda não possui uma conta?</span>
                <div class="mt-2">
                    <a href="{{ url_for('auth.register') }}" class="btn btn-sm botaoSecundario px-3">
                        Criar uma nova conta
                    </a>
                </div>
            </div>

        </form>

    </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const btnToggle = document.getElementById('btnToggleLoginSenha');
    const inputSenha = document.getElementById('loginSenha');
    if (btnToggle && inputSenha) {
        btnToggle.addEventListener('click', function() {
            const icon = this.querySelector('i');
            if (inputSenha.type === 'password') {
                inputSenha.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                inputSenha.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        });
    }
});
</script>

{% endblock %}
